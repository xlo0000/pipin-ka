<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pipin'ka — Комната</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Базовые переменные */
  :root {
    --bg: #f8f9fa; --surface: #ffffff; --surface-hover: #f1f3f5; --border: #e9ecef;
    --text: #212529; --text-muted: #868e96; --accent: #adb5bd; --accent-hover: #868e96; --accent-text: #ffffff;
  }
  
  /* Темы (дублируются с главной) */
  [data-theme="light"] { --bg: #f8f9fa; --surface: #ffffff; --surface-hover: #f1f3f5; --border: #e9ecef; --text: #212529; --text-muted: #868e96; --accent: #adb5bd; --accent-hover: #868e96; --accent-text: #ffffff; }
  [data-theme="dark"] { --bg: #121212; --surface: #1e1e1e; --surface-hover: #2c2c2c; --border: #333333; --text: #f8f9fa; --text-muted: #adb5bd; --accent: #495057; --accent-hover: #6c757d; --accent-text: #ffffff; }
  [data-theme="blue"] { --bg: #e7f5ff; --surface: #ffffff; --surface-hover: #d0ebff; --border: #a5d8ff; --text: #1864ab; --text-muted: #4dabf7; --accent: #74c0fc; --accent-hover: #4dabf7; --accent-text: #0b4f8a; }
  [data-theme="mint"] { --bg: #e6fcf5; --surface: #ffffff; --surface-hover: #c3fae8; --border: #96f2d7; --text: #087f5b; --text-muted: #20c997; --accent: #63e6be; --accent-hover: #38d9a9; --accent-text: #064e3b; }
  [data-theme="pink"] { --bg: #fff0f6; --surface: #ffffff; --surface-hover: #ffdeeb; --border: #fcc2d7; --text: #a61e4d; --text-muted: #f06595; --accent: #faa2c1; --accent-hover: #f06595; --accent-text: #6b0f31; }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s, color 0.3s; }
  
  /* Шапка */
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; border-bottom: 1px solid var(--border); background: var(--surface); z-index: 20; transition: 0.3s; }
  .logo-area { display: flex; align-items: center; gap: 16px; }
  .home-btn { padding: 8px 16px; border-radius: 8px; background: transparent; color: var(--text-muted); border: 1px solid var(--border); cursor: pointer; font-size: 14px; font-weight: 500; transition: 0.2s; display: flex; align-items: center; gap: 6px; }
  .home-btn:hover { background: var(--surface-hover); color: var(--text); }
  .roomcode { font-family: monospace; font-size: 14px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); cursor: pointer; transition: 0.2s; color: var(--text-muted); display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .roomcode:hover { border-color: var(--accent); color: var(--text); }
  
  /* Профиль */
  .profile-area { position: relative; display: flex; align-items: center; gap: 10px; }
  .my-avatar-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-hover); border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text); font-weight: 700; background-size: cover; background-position: center; overflow: hidden; transition: 0.2s; font-size: 16px; }
  .my-avatar-btn:hover { border-color: var(--accent); }
  .profile-menu { display: none; position: absolute; top: 50px; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; width: 260px; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,0.1); flex-direction: column; gap: 12px; }
  .profile-menu.on { display: flex; }
  .profile-menu label { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500; }
  .profile-menu input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; font-size: 14px; }
  .profile-menu .btn { width: 100%; margin-top: 8px; padding: 10px; background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.2s; }
  .profile-menu .btn:hover { border-color: var(--text-muted); }

  /* Основная область */
  .body { flex: 1; display: flex; min-height: 0; }
  .video-pane { flex: 2; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: #000; position: relative; }
  #player { width: 100%; flex: 1; pointer-events: auto; }
  
  /* Оверлей ссылки */
    /* Оверлей ссылки (теперь скрыт по умолчанию) */
  .link-overlay { 
    display: none; /* Скрываем по умолчанию */
    position: absolute; 
    top: 50%; left: 50%; 
    transform: translate(-50%, -50%); 
    background: rgba(255, 255, 255, 0.95); 
    padding: 30px; 
    border-radius: 20px; 
    flex-direction: column; 
    gap: 20px; 
    width: 90%; max-width: 550px; 
    border: 1px solid var(--border); 
    backdrop-filter: blur(15px); 
    z-index: 10; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
    color: var(--text); 
  }
  [data-theme="dark"] .link-overlay { background: rgba(30, 30, 30, 0.95); }
  
  /* Класс для показа окна */
  .link-overlay.on { display: flex; } 
  
  /* Прячем старый класс, который мы использовали раньше */
  .link-overlay.hidden { display: none; }
  .link-overlay h3 { margin-bottom: 5px; font-size: 24px; text-align: center; font-weight: 700; }
  .link-overlay input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; font-size: 16px; transition: 0.2s; }
  .link-overlay input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,0,0,0.05); }
  .link-overlay .btn-row { display: flex; gap: 12px; }
  
  /* Кнопки поверх видео */
  .video-actions { position: absolute; top: 16px; right: 16px; z-index: 10; display: flex; gap: 10px; pointer-events: none; }
  .video-actions .action-btn { pointer-events: auto; }
  .action-btn { background: rgba(255, 255, 255, 0.8); color: var(--text); border: 1px solid var(--border); padding: 10px 16px; border-radius: 8px; cursor: pointer; backdrop-filter: blur(8px); font-size: 14px; font-weight: 600; transition: 0.2s; }
  [data-theme="dark"] .action-btn { background: rgba(30, 30, 30, 0.8); }
  .action-btn:hover { background: var(--surface-hover); border-color: var(--text-muted); }

  /* Панель управления */
  .controls { display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 12px 24px; border-top: 1px solid var(--border); background: var(--surface); }
  .btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-hover); color: var(--text); cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: 0.2s; }
  .btn:hover { background: var(--border); }

  /* Нижняя панель */
  .bottom-panel { border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; height: 180px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); }
  .tab { padding: 14px 24px; font-size: 14px; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; transition: 0.2s; font-weight: 500; }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-content { flex: 1; overflow-y: auto; padding: 16px 24px; }
  
  /* Зрители */
  .viewers-list { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .viewer { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 6px 16px 6px 6px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-hover); font-weight: 500; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 700; text-transform: uppercase; background-size: cover; background-position: center; }

  /* Очередь */
  .queue-list { display: flex; flex-direction: column; gap: 10px; }
  .queue-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface-hover); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); }
  .queue-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .queue-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 400px; }
  .queue-author { font-size: 12px; color: var(--text-muted); }
  .del-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; padding: 0 5px; transition: 0.2s; }
  .del-btn:hover { color: #ef4444; }
  .queue-empty { font-size: 14px; color: var(--text-muted); text-align: center; padding-top: 20px; }

  /* Чат */
  .chat { flex: 1; display: flex; flex-direction: column; background: var(--surface); min-width: 320px; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { font-size: 14px; line-height: 1.5; }
  .msg .author { font-weight: 600; font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .msg .avatar-mini { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 600; background-size: cover; background-position: center; }
  .inputrow { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
  .inp { flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; font-size: 14px; transition: 0.2s; }
  .inp:focus { border-color: var(--accent); }

  #avatarInput { display: none; }

  /* Скроллбар */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  @media (max-width: 768px) {
    .body { flex-direction: column; }
    .video-pane { flex: none; height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
    .chat { flex: 1; min-width: 100%; }
    .logo-area strong { display: none; }
    .controls { padding: 8px 16px; }
    .bottom-panel { height: 160px; }
    .queue-title { max-width: 200px; }
    .link-overlay { padding: 20px; }
    .tab { padding: 12px 16px; }
  }
</style>
</head>
<body>
  
  <div class="topbar">
    <div class="logo-area">
      <button class="home-btn" onclick="window.location.href='/'">← На главную</button>
      <span class="roomcode" id="roomDisplay" title="Нажмите, чтобы скопировать ссылку">
        <span id="roomText">...</span>
      </span>
    </div>
    
    <div class="profile-area">
      <div class="my-avatar-btn" id="myAvatarBtn" title="Мой профиль">Я</div>
      <div class="profile-menu" id="profileMenu">
        <div>
          <label>Моё имя</label>
          <input id="nameInp" placeholder="Имя" autocomplete="off">
        </div>
        <button class="btn" id="uploadPhotoBtn">Загрузить фото</button>
      </div>
    </div>
  </div>
  
  <div class="body">
    <div class="video-pane" id="videoPane">
      <div id="player"></div>
      
      <div class="link-overlay" id="linkOverlay">
        <h3>Что будем смотреть?</h3>
        <input id="urlInp" placeholder="Вставьте ссылку на YouTube..." autocomplete="off">
        <div class="btn-row">
          <button class="btn" style="flex:1; background:var(--accent); color:var(--accent-text); border-color:var(--accent);" onclick="loadVideo(true)">Включить сейчас</button>
          <button class="btn" style="flex:1;" onclick="loadVideo(false)">Добавить в очередь</button>
        </div>
      </div>
      
      <div class="video-actions" id="videoActions" style="display:none;">
        <button class="action-btn" onclick="showLinkOverlay()">+ Добавить</button>
        <button class="action-btn" onclick="playNext()">Следующее</button>
      </div>

      <div class="controls">
        <button class="btn" id="fsBtn" title="На весь экран" style="display:none;">На весь экран</button>
      </div>
      
      <div class="bottom-panel">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('viewers')">Зрители (<span id="viewerCount">0</span>)</div>
          <div class="tab" onclick="switchTab('queue')">Очередь (<span id="queueCount">0</span>)</div>
        </div>
        
        <div class="tab-content" id="tab-viewers">
          <div class="viewers-list" id="viewersList"></div>
        </div>
        
        <div class="tab-content" id="tab-queue" style="display:none;">
          <div class="queue-list" id="queueList"></div>
        </div>
      </div>
    </div>
    
    <div class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="inputrow">
        <input class="inp" id="inp" placeholder="Написать сообщение..." autocomplete="off">
        <button class="btn" style="background:var(--accent); color:var(--accent-text); border-color:var(--accent);" onclick="sendMsg()">→</button>
      </div>
    </div>
  </div>

  <input type="file" id="avatarInput" accept="image/*">

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // 1. Применяем сохраненную тему
    const savedTheme = localStorage.getItem('pipinka_theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);

    // 2. Переменные
    let player, socket;
    let isRemoteAction = false;
    let actionLock = false;     
    let currentViewers = [];
    let myAvatar = localStorage.getItem('kinoroom_avatar') || '';
    let queue = []; 
    
    let currentUser = JSON.parse(localStorage.getItem('kinoroom_user')) || null;

    const urlParams = new URLSearchParams(window.location.search);
    let room = urlParams.get('room');
    if (!room) { window.location.href = '/'; }
    document.getElementById('roomText').textContent = room;

    document.getElementById('roomDisplay').onclick = () => {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('Ссылка скопирована! Отправь её другу:\n' + window.location.href);
      });
    };

    let myName = currentUser ? currentUser.name : (localStorage.getItem('kinoroom_name') || 'Гость-' + Math.floor(Math.random() * 100));
    document.getElementById('nameInp').value = myName;

    const profileMenu = document.getElementById('profileMenu');
    document.getElementById('myAvatarBtn').onclick = (e) => {
      e.stopPropagation();
      profileMenu.classList.toggle('on');
    };
    document.addEventListener('click', () => profileMenu.classList.remove('on'));
    profileMenu.addEventListener('click', (e) => e.stopPropagation());

    document.getElementById('nameInp').addEventListener('input', (e) => {
      let newName = e.target.value.trim();
      if (!newName) return;
      localStorage.setItem('kinoroom_name', newName);
      updateMyButton();
      socket.emit('update-profile', { room: room, name: newName, avatar: myAvatar });
    });

    document.getElementById('uploadPhotoBtn').onclick = () => document.getElementById('avatarInput').click();
    document.getElementById('avatarInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = 100; canvas.height = 100;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, 100, 100);
          myAvatar = canvas.toDataURL('image/jpeg', 0.8);
          
          localStorage.setItem('kinoroom_avatar', myAvatar);
          updateMyButton();
          socket.emit('update-profile', { room: room, name: document.getElementById('nameInp').value, avatar: myAvatar });
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function updateMyButton() {
      const btn = document.getElementById('myAvatarBtn');
      if (myAvatar) {
        btn.style.backgroundImage = `url('${myAvatar}')`;
        btn.textContent = '';
      } else {
        btn.style.backgroundImage = 'none';
        btn.textContent = (document.getElementById('nameInp').value.charAt(0) || '?').toUpperCase();
      }
    }
    updateMyButton();

    const colors = ['#74c0fc', '#faa2c1', '#63e6be', '#ffd43b', '#b197fc', '#ffc078'];
    function getColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    socket = io();
        socket.emit('join', { 
      room: room, 
      name: myName, 
      avatar: myAvatar, 
      userId: currentUser ? currentUser.id : null 
    });

    socket.on('room-state', (state) => {
      if (state.videoId) {
        loadYT(state.videoId);
        hideLinkOverlay();
      } else {
        showLinkOverlay();
      }
      
      state.chat.forEach(msg => addMsg(msg.name, msg.text, msg.avatar));
      currentViewers = state.viewers || [];
      queue = state.queue || [];
      
      updateViewersList();
      updateQueueList();
    });

    socket.on('viewers-update', (viewers) => {
      currentViewers = viewers;
      updateViewersList();
    });

    socket.on('queue-update', (newQueue) => {
      queue = newQueue;
      updateQueueList();
    });

    socket.on('video-action', (data) => {
      if (!player) return;
      actionLock = true;
      isRemoteAction = true;

      if (data.videoId && data.videoId !== player.getVideoData().video_id) {
        player.loadVideoById(data.videoId);
      }
      
      setTimeout(() => {
        const currentTime = player.getCurrentTime();
        const diff = Math.abs(currentTime - data.time);
        if (diff > 2) player.seekTo(data.time, true);
        
        if (data.playing && player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
        else if (!data.playing && player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
      }, 300);

      setTimeout(() => {
        isRemoteAction = false;
        actionLock = false;
      }, 1200);
    });

    socket.on('chat-message', (msg) => {
      addMsg(msg.name, msg.text, msg.avatar);
    });

    function updateViewersList() {
      const list = document.getElementById('viewersList');
      list.innerHTML = '';
      document.getElementById('viewerCount').textContent = currentViewers.length;
      
      const myCurrentName = document.getElementById('nameInp').value.trim() || myName;
      currentViewers.forEach(v => {
        if (v.id === socket.id) { v.name = myCurrentName; v.avatar = myAvatar; }
        
        const div = document.createElement('div');
        div.className = 'viewer';
        let bgStyle = v.avatar ? `background-image: url('${v.avatar}')` : `background:${getColor(v.name)}`;
        let content = v.avatar ? '' : (v.name.charAt(0) || '?');
        div.innerHTML = `<div class="avatar" style="${bgStyle}">${content}</div><span>${v.name}</span>`;
        list.appendChild(div);
      });
    }

    function updateQueueList() {
      const list = document.getElementById('queueList');
      list.innerHTML = '';
      document.getElementById('queueCount').textContent = queue.length;

      if (queue.length === 0) {
        list.innerHTML = '<div class="queue-empty">Очередь пуста. Добавьте видео!</div>';
        return;
      }

      queue.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'queue-item';
        div.innerHTML = `
          <div class="queue-info">
            <span class="queue-title">${index + 1}. ${item.title || 'Видео YouTube'}</span>
            <span class="queue-author">Добавил: ${item.author}</span>
          </div>
          ${item.authorId === socket.id ? '<button class="del-btn" onclick="removeFromQueue(' + index + ')" title="Удалить">✕</button>' : ''}
        `;
        list.appendChild(div);
      });
    }

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
      
      if (name === 'viewers') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('tab-viewers').style.display = 'block';
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('tab-queue').style.display = 'block';
      }
    }

    function showLinkOverlay() { document.getElementById('linkOverlay').classList.remove('hidden'); }
    function hideLinkOverlay() { document.getElementById('linkOverlay').classList.add('hidden'); document.getElementById('videoActions').style.display = 'flex'; }

    function loadVideo(playNow) {
      const url = document.getElementById('urlInp').value;
      let id = null;
      try {
        const u = new URL(url);
        id = u.searchParams.get('v') || (u.hostname.includes('youtu.be') ? u.pathname.slice(1) : null);
      } catch(e) {}
      
      if (!id) return alert('Ссылка неверная.');
      
      fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`)
        .then(res => res.json())
        .then(data => {
          const title = data.title;
          const name = document.getElementById('nameInp').value.trim() || myName;
          
          if (playNow) {
            socket.emit('play-now', { room: room, videoId: id, title: title });
            if (player) player.loadVideoById(id);
            else loadYT(id);
            hideLinkOverlay();
          } else {
            socket.emit('add-to-queue', { room: room, videoId: id, title: title, author: name, authorId: socket.id });
            document.getElementById('urlInp').value = '';
            switchTab('queue');
          }
        })
        .catch(() => {
          const name = document.getElementById('nameInp').value.trim() || myName;
          if (playNow) {
             socket.emit('play-now', { room: room, videoId: id, title: null });
             if (player) player.loadVideoById(id); else loadYT(id);
             hideLinkOverlay();
          } else {
             socket.emit('add-to-queue', { room: room, videoId: id, title: null, author: name, authorId: socket.id });
             switchTab('queue');
          }
        });
    }

    function removeFromQueue(index) { socket.emit('remove-from-queue', { room: room, index: index }); }
    function playNext() { socket.emit('play-next', { room: room }); }

    function loadYT(videoId) {
      if (player) { player.loadVideoById(videoId); return; }
      player = new YT.Player('player', {
        videoId: videoId,
        playerVars: { rel: 0, origin: window.location.origin, controls: 1 },
        events: {
          onReady: () => {
            document.getElementById('fsBtn').style.display = 'block';
          },
          onStateChange: (e) => {
            if (isRemoteAction || actionLock) return;
            
            const time = player.getCurrentTime();
            if (e.data === YT.PlayerState.PAUSED) {
              socket.emit('video-action', { room: room, playing: false, time: time });
            } else if (e.data === YT.PlayerState.PLAYING) {
              socket.emit('video-action', { room: room, playing: true, time: time });
            } else if (e.data === YT.PlayerState.ENDED) {
              socket.emit('video-ended', { room: room });
            }
          }
        }
      });
    }

    document.getElementById('fsBtn').onclick = () => {
      const videoPane = document.getElementById('videoPane');
      if (!document.fullscreenElement) {
        if (videoPane.requestFullscreen) videoPane.requestFullscreen();
        else if (videoPane.webkitRequestFullscreen) videoPane.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    function sendMsg() {
      const inp = document.getElementById('inp');
      if (!inp.value.trim()) return;
      const name = document.getElementById('nameInp').value.trim() || myName;
      socket.emit('chat-message', { room: room, name: name, text: inp.value, avatar: myAvatar });
      inp.value = '';
    }

    function addMsg(name, text, avatar) {
      const div = document.createElement('div');
      div.className = 'msg';
      let bgStyle = avatar ? `background-image: url('${avatar}')` : `background:${getColor(name)}`;
      let content = avatar ? '' : (name.charAt(0) || '?');
      div.innerHTML = `<span class="author"><span class="avatar-mini" style="${bgStyle}">${content}</span>${name}</span><span>${text}</span>`;
      document.getElementById('msgs').appendChild(div);
      document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    }

    document.getElementById('inp').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
</html>
