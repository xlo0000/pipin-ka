<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KinoRoom — смотрим вместе</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a; --text:#e8eaf0; --text2:#9aa3b2; --accent:#e8eaf0; --c1:#4c8dff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel); }
  .roomcode { font-family:monospace; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); cursor:pointer; transition: 0.2s; }
  .roomcode:hover { border-color: var(--text2); background: var(--line); }
  .body { flex:1; display:flex; min-height:0; }
  .video-pane { flex:2; display:flex; flex-direction:column; border-right:1px solid var(--line); background:#000; }
  
  #player { width:100%; flex:1; }
  
  /* Панель управления */
  .controls { display:flex; align-items:center; gap:12px; padding:12px 16px; border-top:1px solid var(--line); background:var(--panel); }
  .btn { padding:8px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--text); cursor:pointer; font-size:14px; white-space:nowrap; }
  .btn:hover { background:var(--line); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .progress { flex:1; height:24px; cursor:pointer; display:flex; align-items:center; }
  .track { width:100%; height:5px; background:var(--line); border-radius:3px; position:relative; }
  .fill { position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:3px; width:0; }
  .time { font-size:12px; color:var(--text2); font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* Чат */
  .chat { flex:1; display:flex; flex-direction:column; background:var(--panel); min-width:280px; }
  .msgs { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { font-size:14px; line-height:1.4; }
  .author { font-weight:bold; font-size:12px; color:var(--text2); display:block; margin-bottom:2px; }
  .inputrow { padding:12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .inp { flex:1; padding:8px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel2); color:var(--text); outline:none; }

  /* Полноэкранный режим */
  .video-pane:fullscreen { border:none; }
  .video-pane:fullscreen .controls { padding: 20px; }
  
  /* АДАПТАЦИЯ ПОД ТЕЛЕФОНЫ */
  @media (max-width: 768px) {
    .body { flex-direction: column; }
    .video-pane { flex: none; height: 50vh; border-right: none; border-bottom: 1px solid var(--line); }
    .chat { flex: 1; min-width: 100%; }
    .topbar { flex-wrap: wrap; padding: 10px; gap: 8px; }
    .topbar strong { display: none; }
    .topbar input, .topbar .btn { font-size: 14px; }
    #urlInp { min-width: 100%; margin-bottom: 4px; }
    .controls { padding: 8px; gap: 8px; }
    .btn { padding: 10px 16px; font-size: 15px; }
    .time { font-size: 13px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <strong>🎬 KinoRoom</strong>
    <span class="roomcode" id="roomDisplay" title="Нажмите, чтобы скопировать ссылку">
      Комната: <span id="roomText">...</span> 📋
    </span>
    <span style="display:flex; align-items:center; gap:5px;">
      <!-- ДОБАВЛЕНЫ АТРИБУТЫ АВТОЗАПОЛНЕНИЯ -->
      Ваше имя: <input id="nameInp" placeholder="Имя" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:100px;background:transparent;border:1px solid var(--line);padding:4px 8px;border-radius:4px;color:inherit;outline:none;">
    </span>
    <div style="flex:1"></div>
    <input id="urlInp" placeholder="Ссылка YouTube..." autocomplete="off" style="width:250px;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:white;">
    <button class="btn" onclick="loadVideo()">Загрузить видео</button>
  </div>
  
  <div class="body">
    <div class="video-pane" id="videoPane">
      <div id="player"></div>
      <!-- Панель управления -->
      <div class="controls">
        <button class="btn" id="playBtn" disabled>Смотреть</button>
        <button class="btn" id="fsBtn" title="На весь экран" style="display:none;">⛶</button>
        <div class="progress" id="progress">
          <div class="track"><div class="fill" id="fill"></div></div>
        </div>
        <span class="time" id="timeLbl">0:00 / 0:00</span>
      </div>
    </div>
    <div class="chat">
      <div class="msgs" id="msgs"></div>
      <div class="inputrow">
        <input class="inp" id="inp" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" onclick="sendMsg()">→</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player, socket, isRemote = false;
    let tickTimer = null;

    // 1. Получаем комнату из ссылки (если есть) или генерируем новую
    const urlParams = new URLSearchParams(window.location.search);
    let room = urlParams.get('room');
    if (!room) {
      room = 'room-' + Math.random().toString(36).substring(2, 6);
      window.history.replaceState(null, '', '?room=' + room); 
    }
    document.getElementById('roomText').textContent = room;

    // Кнопка копирования ссылки
    document.getElementById('roomDisplay').onclick = () => {
      const link = window.location.href;
      navigator.clipboard.writeText(link).then(() => {
        alert('Ссылка на комнату скопирована! Отправь её другу:\n' + link);
      });
    };

    // 2. Имя пользователя
    let myName = localStorage.getItem('kinoroom_name');
    if (!myName) {
      myName = 'Гость-' + Math.floor(Math.random() * 100);
    }
    document.getElementById('nameInp').value = myName;

    document.getElementById('nameInp').addEventListener('input', (e) => {
      localStorage.setItem('kinoroom_name', e.target.value);
    });

    // Инициализация сокета
    socket = io();
    socket.emit('join', { room: room, name: myName });

    socket.on('room-state', (state) => {
      if (state.videoId) {
        loadYT(state.videoId);
      }
      state.chat.forEach(msg => addMsg(msg.name, msg.text));
    });

    socket.on('video-action', (data) => {
      if (!player) return;
      isRemote = true;
      if (data.videoId && data.videoId !== player.getVideoData().video_id) {
        player.loadVideoById(data.videoId);
      }
      if (data.playing) {
        player.seekTo(data.time, true);
        player.playVideo();
      } else {
        player.seekTo(data.time, true);
        player.pauseVideo();
      }
      setTimeout(() => isRemote = false, 500);
    });

    socket.on('chat-message', (msg) => {
      addMsg(msg.name, msg.text);
    });

    // --- Управление видео ---
    function loadVideo() {
      const url = document.getElementById('urlInp').value;
      let id = null;
      try {
        const u = new URL(url);
        id = u.searchParams.get('v') || (u.hostname.includes('youtu.be') ? u.pathname.slice(1) : null);
      } catch(e) {}
      
      if (!id) return alert('Ссылка неверная. Нужна ссылка вида youtube.com/watch?v=...');
      
      socket.emit('video-action', { room: room, videoId: id, playing: true, time: 0 });
      
      if (player) {
        player.loadVideoById(id);
      } else {
        loadYT(id);
      }
    }

    function loadYT(videoId) {
      if (player) {
        player.loadVideoById(videoId);
        return;
      }
      player = new YT.Player('player', {
        videoId: videoId,
        playerVars: { rel: 0, origin: window.location.origin },
        events: {
          onReady: () => {
            document.getElementById('playBtn').disabled = false;
            document.getElementById('fsBtn').style.display = 'block';
            document.getElementById('player').style.pointerEvents = 'none'; 
            startTick();
          },
          onStateChange: (e) => {
            if (isRemote) return;
            const time = player.getCurrentTime();
            if (e.data === YT.PlayerState.PAUSED) {
              document.getElementById('playBtn').textContent = 'Смотреть';
              socket.emit('video-action', { room: room, playing: false, time: time });
            } else if (e.data === YT.PlayerState.PLAYING) {
              document.getElementById('playBtn').textContent = 'Пауза';
              socket.emit('video-action', { room: room, playing: true, time: time });
            }
          }
        }
      });
    }

    // Кнопка паузы
    document.getElementById('playBtn').onclick = () => {
      if (!player) return;
      const st = player.getPlayerState();
      const time = player.getCurrentTime();
      if (st === YT.PlayerState.PLAYING) {
        player.pauseVideo();
        socket.emit('video-action', { room: room, playing: false, time: time });
      } else {
        player.playVideo();
        socket.emit('video-action', { room: room, playing: true, time: time });
      }
    };

    // Перемотка
    document.getElementById('progress').onclick = function(e) {
      if (!player) return;
      const dur = player.getDuration();
      if (!dur) return;
      const r = this.getBoundingClientRect();
      const ratio = (e.clientX - r.left) / r.width;
      const newTime = dur * ratio;
      
      player.seekTo(newTime, true);
      socket.emit('video-action', { 
        room: room, 
        playing: player.getPlayerState() === YT.PlayerState.PLAYING, 
        time: newTime 
      });
    };

    // Таймер
    function startTick() {
      if(tickTimer) clearInterval(tickTimer);
      tickTimer = setInterval(() => {
        if (!player || typeof player.getCurrentTime !== 'function') return;
        const cur = player.getCurrentTime() || 0;
        const dur = player.getDuration() || 0;
        if (dur > 0) {
          document.getElementById('fill').style.width = (cur / dur * 100) + '%';
          document.getElementById('timeLbl').textContent = fmt(cur) + ' / ' + fmt(dur);
        }
      }, 250);
    }

    function fmt(s) { s = Math.max(0, Math.floor(s)); const m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }

    // --- Полный экран ---
    document.getElementById('fsBtn').onclick = () => {
      const videoPane = document.getElementById('videoPane');
      if (!document.fullscreenElement) {
        if (videoPane.requestFullscreen) videoPane.requestFullscreen();
        else if (videoPane.webkitRequestFullscreen) videoPane.webkitRequestFullscreen();
        else if (videoPane.msRequestFullscreen) videoPane.msRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    };

    // --- Чат ---
    function sendMsg() {
      const inp = document.getElementById('inp');
      if (!inp.value.trim()) return;
      const name = document.getElementById('nameInp').value.trim() || myName;
      socket.emit('chat-message', { room: room, name: name, text: inp.value });
      inp.value = '';
    }

    function addMsg(name, text) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<span class="author">${name}</span>${text}`;
      document.getElementById('msgs').appendChild(div);
      document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
    }

    document.getElementById('inp').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>
</body>
</html>
